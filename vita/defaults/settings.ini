; OpenYAMM settings
; Volumes use the original-style 0..9 scale.

[profile]
name=android
version=2

[assets]
root=

[audio]
sound_volume=9
music_volume=9
voice_volume=9

[controls]
turn_rate=32x
control_scheme=modern
walksound=true
show_hits=true
always_run=true
flip_on_exit=false
mouse_sensitivity=100

[gameplay]
keyboard_interaction_depth=512
mouse_interaction_depth=512
combat_text=true
combat_actor_hp_bars=true
quest_markers=true
combat_target_panel=false
context_action_popup=true

[startup]
start_in_main_menu=true

[features]
bolster_monsters=false
indoor_pathfinding=true
outdoor_pathfinding=false
monster_projectile_visuals=fx_recipes
blaster_skill_scaling=default
blaster_min_recovery=default

[logging]
indoor_visibility=false
indoor_pathfinding=false
outdoor_pathfinding=false
fps_trace=false
performance_trace=false
hitch_trace=false
collision_trace=false
gameplay_trace=false
gameplay_trace_file=logs/gameplay_trace.log
gameplay_trace_append=true
combat_trace=false
combat_trace_file=logs/combat_trace.log
combat_trace_append=true
hitch_threshold_ms=8

[input]
forward=W
backward=S
left=A
right=D
yell=Y
jump=X
combat=Return
cast_ready=Q
attack=F
trigger=Space
cast=C
pass=B
char_cycle=Tab
quest=I
quick_ref=Z
rest=R
history=H
use=E
map_book=L
always_run_toggle=U
look_up=Page_Down
look_down=Delete
center_view=End
zoom_in=Add
zoom_out=Subtract
fly_up=J
fly_down=K
land=Home
double_speed=F2

[video]
blood_splats=true
colored_lights=true
tinting=true
shadows=false
sprite_outline=false
texture_filtering=true
terrain_filtering=anisotropic
terrain_anisotropy=8x
bmodel_filtering=anisotropic
billboard_filtering=linear
ui_filtering=linear
text_filtering=nearest
minimap_filtering=linear
view_distance=default
outdoor_billboard_depth_slice=256
skip_event_cutscenes=false
wait_for_level_sprites=true
window_mode=windowed
resolution=960x544
vsync=true
gameplay_ui_layout=widescreen

selection_tint=true
[video_quality]
texture=x1
terrain=x1
sky=x1
sprites=x1
decorations=x1
icons=x1
ui=x1
effects=x1
fonts=x1

[debug]
preseed_party=false
party_seed_roster_id=0
start_world=mm8
start_map_file=
override_start_position=false
start_x=0
start_y=0
start_z=0
start_flying=false
movement_speed_multiplier=1
immortal=false
unlimited_mana=false
new_game_god_lich=false
allow_incomplete_character_creation=false
console=true
